name: CI

# DB 的首个 GitHub Actions 门（2026-11-04 起）。结构照 AutoForge 的 ci.yml：
# 拆「全量 pytest」与「跨仓契约 tests/contract」两条独立硬闸。
#
# 失败清单会被打成一条 annotation（公开可读），不登录也能从 API 查到红在哪：
#   GET /repos/<owner>/<repo>/commits/<sha>/check-runs -> annotations
#
# `.env` 处理口径（两条既有测试互相拉扯，这里取交集）：
#   - batch210 的 leak 区间腿要在仓根读到 `.env` 才肯跑（否则判"未量"）；
#   - batch206 会扫 tests/butler/scripts/根四枚配置件，凡出现 `.env` 真值即判"码面抄真值"。
#   ⇒ 写一份**唯一哨兵值**的 `.env`：够长（≥10）、但不出现于任何被扫文件里。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMESDK_WHEEL: vendor/homesdk-0.3.3-py3-none-any.whl

jobs:
  pytest:
    name: pytest 全量
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # batch210 的 leak 区间腿要 HEAD~1；浅克隆会让它"未量"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install homesdk wheel 0.3.3
        run: pip install "$HOMESDK_WHEEL"
      - name: Install test tooling
        run: pip install pytest pytest-asyncio pytest-cov
      - name: Prepare runtime face (sentinel .env)
        run: |
          mkdir -p data tts
          printf '%s\n' \
            'DOUBAO_API_KEY=ci-sentinel-doubao-api-key-0001' \
            'DESKPILOT_API_TOKEN=ci-sentinel-deskpilot-token-0001' \
            'TASK_REPORT_TOKEN=ci-sentinel-task-report-token-0001' \
            'BUTLER_WEB_PASSWORD=ci-sentinel-web-password-0001' \
            > .env
      - name: Run full test suite
        run: |
          set -o pipefail
          pytest tests -q --tb=no 2>&1 | tee /tmp/pytest.log
      - name: Surface failure summary as annotation
        if: failure()
        run: python3 -c "import pathlib,urllib.parse; t=pathlib.Path('/tmp/pytest.log').read_text(errors='replace'); print('::error::'+urllib.parse.quote('\n'.join(t.splitlines()[-30:]),safe=''))"

  contracts:
    name: adm-linkage-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install homesdk wheel 0.3.3
        run: pip install "$HOMESDK_WHEEL"
      - name: Install test tooling
        run: pip install pytest pytest-asyncio pytest-cov
      - name: Prepare runtime face (sentinel .env)
        run: |
          mkdir -p data tts
          printf '%s\n' \
            'DOUBAO_API_KEY=ci-sentinel-doubao-api-key-0001' \
            'DESKPILOT_API_TOKEN=ci-sentinel-deskpilot-token-0001' \
            'TASK_REPORT_TOKEN=ci-sentinel-task-report-token-0001' \
            'BUTLER_WEB_PASSWORD=ci-sentinel-web-password-0001' \
            > .env
      - name: Run ADM linkage contract tests
        # 独立于全量 suite；--no-cov：只跑契约目录时 --cov-fail-under=30 会误红。
        run: |
          set -o pipefail
          pytest tests/contract -v --no-cov 2>&1 | tee /tmp/contract.log
      - name: Surface contract failure summary as annotation
        if: failure()
        run: python3 -c "import pathlib,urllib.parse; t=pathlib.Path('/tmp/contract.log').read_text(errors='replace'); print('::error::'+urllib.parse.quote('\n'.join(t.splitlines()[-30:]),safe=''))"
