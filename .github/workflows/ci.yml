name: CI

# DB 的首个 GitHub Actions 门（2026-11-04 起）。结构照 AutoForge 的 ci.yml：
# 拆「全量 pytest」与「跨仓契约 tests/contract」两条独立硬闸，避免契约腿被历史不稳用例淹没。
#
# 为什么不跑 gates.sh 的 leak 腿：DB 的 `scripts/leak_gate.py` 要读真实 `.env` 比对标密；
# CI 里没有真 `.env`（gitignore），拿 `.env.example` 占位去比会把它判成"疑似泄露"。
# 这条留本机/部署面跑，CI 先跑 pytest + 契约两条客观闸。
#
# 失败清单会被打成**一条 annotation**（公开可读），所以不登录 GitHub 也能从 API 读到红在哪：
#   GET /repos/<owner>/<repo>/commits/<sha>/check-runs -> annotations

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMESDK_WHEEL: vendor/homesdk-0.3.3-py3-none-any.whl

jobs:
  pytest:
    name: pytest 全量
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install homesdk wheel 0.3.3
        run: pip install "$HOMESDK_WHEEL"
      - name: Install test tooling
        run: pip install pytest pytest-asyncio pytest-cov
      - name: Prepare runtime face
        run: |
          cp .env.example .env
          mkdir -p data tts
      - name: Run full test suite
        run: |
          set -o pipefail
          pytest tests -q --tb=no 2>&1 | tee /tmp/pytest.log
      - name: Surface failed tests as one annotation
        if: failure()
        run: grep -E '^(FAILED|ERROR) ' /tmp/pytest.log | python3 -c "import sys,urllib.parse; t=sys.stdin.read(); print('::error::'+urllib.parse.quote(t,safe='')) if t.strip() else None"

  contracts:
    name: adm-linkage-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install homesdk wheel 0.3.3
        run: pip install "$HOMESDK_WHEEL"
      - name: Install test tooling
        run: pip install pytest pytest-asyncio pytest-cov
      - name: Prepare runtime face
        run: |
          cp .env.example .env
          mkdir -p data tts
      - name: Run ADM linkage contract tests
        # 独立于全量 suite：只跑 tests/contract，⛔ 被历史不稳用例淹没。
        # --no-cov：pytest.ini 的 --cov-fail-under=30 会在只跑契约目录时误红。
        run: |
          set -o pipefail
          pytest tests/contract -v --no-cov 2>&1 | tee /tmp/contract.log
      - name: Surface contract failures as one annotation
        if: failure()
        run: grep -E '^(FAILED|ERROR) ' /tmp/contract.log | python3 -c "import sys,urllib.parse; t=sys.stdin.read(); print('::error::'+urllib.parse.quote(t,safe='')) if t.strip() else None"
